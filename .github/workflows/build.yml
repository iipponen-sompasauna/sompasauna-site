name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Vaihda 'npm ci':ksi kun package-lock.json on committoitu repoon.
      - run: npm install --no-audit --no-fund

      # Julkaistaan custom domainiin new.sompasauna.fi -> tarjoillaan juuresta.
      # src/CNAME ohjaa GitHub Pagesin käyttämään tuota osoitetta.
      - run: npm run build

      # Ei vaadi Pagesin käyttöönottoa – tämä vaihe on aina vihreä.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Vaatii kertaluontoisen käyttöönoton:
  # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
  # Sitä ennen tämä job epäonnistuu (build-job menee silti läpi).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
